spring:
  application:
    name: notification
  mongodb:
    database: notifications   # its own database: services never share their data
  data:
    mongodb:
      auto-index-creation: true   # the unique index on messageId (idempotency)
  rabbitmq:
    listener:
      simple:
        default-requeue-rejected: false   # a message that fails goes to its dead-letter queue, not round and round
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8086

# health answers Docker and Cloud Run; info is harmless. Never expose everything: some endpoints show settings.
management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness, the two questions an orchestrator asks

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"   # every log line shows the request's correlation id (empty outside a request)
