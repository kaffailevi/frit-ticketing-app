spring:
  application:
    name: ticketing
  data:
    mongodb:
      auto-index-creation: true   # create the @Indexed / @CompoundIndex indexes at startup
  mongodb:
    database: ticketing   # locally: mongodb://localhost:27017 (compose.yml); in the cloud profile: Atlas
  mvc:
    problemdetails:
      enabled: true   # Spring's own errors (400, 404, 415, ...) are answered as application/problem+json

server:
  port: 8085

# Learning events stored by DataSeeder when the events collection is empty.
ticketing:
  seed-events:
    - id: react-cluj
      name: "React Workshop: Hooks in Practice"
      venue-name: Cluj Innovation Park
      city: Cluj-Napoca
      starts-at: 2027-02-10T18:00:00
      capacity: 30
