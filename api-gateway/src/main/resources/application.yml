spring:
  application:
    name: gateway

server:
  port: 8080

# Where the services run. Locally: the two bootRun ports. In Docker and on Cloud Run: environment variables
# GATEWAY_TICKETING_URI and GATEWAY_NOTIFICATIONS_URI override these.
gateway:
  ticketing-uri: http://localhost:8085
  notifications-uri: http://localhost:8086
  api-key: ${GATEWAY_API_KEY:}   # a secret: only from the environment. Empty = no check (local development only)
  rate-limit:
    capacity: 20     # requests per client ...
    period: 10s      # ... per 10 seconds; the 21st gets 429

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true   # /actuator/health/liveness and /readiness, for Docker and Cloud Run

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"   # every log line shows the request's correlation id (empty outside a request)
