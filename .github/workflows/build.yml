# A row of gates: compile → test → images → deploy. A red gate stops everything after it.
# Every push and pull request runs the first three; only main deploys to Cloud Run (deploy/github-actions.md).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:   # "Run workflow" in GitHub: deploy main again without a new commit

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5   # caches Gradle's downloads between runs
      - run: ./gradlew assemble testClasses     # the code and the tests compile

  test:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew build   # every test, Testcontainers and ArchUnit included

  images:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose build   # the three images still build from the one Dockerfile

  deploy:
    needs: images
    # Only main, and only once the set-up has run: a fork, or this repository before deploy/setup-pipeline.sh,
    # skips the job and stays green.
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    concurrency:
      group: production
      cancel-in-progress: false   # a deploy that has started always finishes; the next one waits
    permissions:
      contents: read
      id-token: write   # this job alone may ask GitHub for a signed token, to trade for Google's
    env:
      CLOUDSDK_CORE_PROJECT: ${{ vars.GCP_PROJECT_ID }}
      CLOUDSDK_RUN_REGION: ${{ vars.GCP_REGION }}
      REPO: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/ticketing
      TAG: ${{ github.sha }}   # one commit, one image, forever: never :latest
    steps:
      - uses: actions/checkout@v5

      # Workload Identity Federation: no key anywhere. GitHub's token for this repository and branch
      # buys an hour as github-deployer.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push the images, tagged with the commit SHA
        run: |
          for pair in ticketing-service:8085 notification-service:8086 api-gateway:8080; do
            service=${pair%%:*}
            docker build --build-arg SERVICE="$service" --build-arg PORT="${pair#*:}" -t "$REPO/$service:$TAG" .
            docker push "$REPO/$service:$TAG"
          done

      # Only the image changes. The account, port, profile, hosts, secrets and probes set in deploy/cloud-run.md
      # stay on each service. Each deploy waits until the new revision passes its readiness probe.
      - name: Deploy to Cloud Run
        run: |
          for service in notification-service ticketing-service api-gateway; do
            gcloud run deploy "$service" --image "$REPO/$service:$TAG" --update-labels "commit=$TAG" --quiet
            gcloud run services update-traffic "$service" --to-latest --quiet   # undoes a rollback's pin
          done

      # The gateway is public but asks every caller for X-Api-Key, and the key is not in GitHub on purpose.
      # So: the health check answers, and /events without a key is refused by the gateway itself (401).
      - name: Smoke test
        run: |
          url=$(gcloud run services describe api-gateway --format='value(status.url)')
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$url/actuator/health"
          echo
          status=$(curl -s -o /dev/null -w '%{http_code}' "$url/events")
          if [ "$status" != 401 ]; then
            echo "GET /events without a key answered $status, expected 401"
            exit 1
          fi
          echo "Deployed $TAG, serving at $url"
